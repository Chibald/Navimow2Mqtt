services:
  navimow2mqtt:
    build: .
    image: navimow2mqtt:latest
    container_name: navimow2mqtt
    restart: unless-stopped
    # All settings come from .env (copy .env.example to .env and fill it in).
    env_file: .env
    ports:
      - "8099:8099"          # login page; keep it on your LAN
    volumes:
      - navimow-data:/data   # OAuth token; survives rebuilds

volumes:
  navimow-data:
