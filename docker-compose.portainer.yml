# For Portainer (Stacks, Web editor). Uses a ready-made image (see docs/PORTAINER.md):
# nothing is built on the server. Fill in the ${...} values under "Environment variables"
# of the stack; where there is a :-, the value after :- is the default if you fill in nothing.
services:
  navimow2mqtt:
    image: navimow2mqtt:latest
    container_name: navimow2mqtt
    restart: unless-stopped
    ports:
      - "8099:8099"            # sign-in page and map; only on your own network
    environment:
      MQTT_HOST: ${MQTT_HOST}                      # your broker (IP or name, reachable from the container)
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-navimow}
      MQTT_DISCOVERY: ${MQTT_DISCOVERY:-false}     # only for Home Assistant; openHAB does not need it
      PUBLIC_URL: ${PUBLIC_URL:-}                  # e.g. http://192.168.1.5:8099 (address of this server)
      TIMEZONE: ${TIMEZONE:-Europe/Amsterdam}      # decides when a week starts
      LANGUAGE: ${LANGUAGE:-en}                    # language of the sign-in page and the map: en or nl
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - navimow-data:/data                         # token, statistics and logs; survives updates

volumes:
  navimow-data:
